; PlatformIO 配置 — clawd-mochi-m5dial
; 引脚 / 架构 / 库选型详见根目录 CLAUDE.md
; HOLD pin G46 必须拉高，否则 M5Dial 上电后立即断电（M5Dial.begin 已自动处理）

[env:m5dial]
platform = espressif32
board = m5stack-stamps3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

board_build.filesystem = littlefs

lib_deps =
    m5stack/M5Dial

build_flags =
    -DCORE_DEBUG_LEVEL=3
