; PlatformIO 配置 — clawd-mochi-m5dial
; 引脚 / 架构 / 库选型详见根目录 CLAUDE.md
; HOLD pin G46 必须拉高，否则 M5Dial 上电后立即断电（M5Dial.begin 已自动处理）

[env:m5dial]
platform = espressif32
board = m5stack-stamps3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

board_build.filesystem = littlefs

lib_deps =
    m5stack/M5Dial
    ESP32Async/ESPAsyncWebServer @ ^3.11.0
    ESP32Async/AsyncTCP @ ^3.4.10
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1   ; 让 Arduino 的 Serial 走 USB-CDC（COM5），而非默认的 UART0(GPIO43/44)
